# Construit Home.app sur un Mac de GitHub, Home pour Windows sur un PC de GitHub, et publie une release avec les deux.
# - Actions → Construire Home → Run workflow, avec une version (ex. 0.2.0) : release « Home 0.2.0 » (tag v0.2.0) avec Home-macSilicon.dmg (Mac, Apple
#   Silicon) et Home-win64-setup.exe (Windows 64 bits), chacun avec son .sha256. Le dépôt est public : Home lit ses releases sans jeton pour se
#   mettre à jour. Un tag v* poussé fait pareil.
# - Un push sur main, ou Run workflow sans version : construction seule, l'app est gardée 7 jours dans les artefacts du run.
name: Construire Home

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.2.0). Vide : construction seule, sans release"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}   # une release (Run workflow) n'est jamais annulée par un push
  cancel-in-progress: true

jobs:
  construire:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publier: ${{ steps.version.outputs.publier }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          VERSION_DEMANDEE: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; publier=1
          elif [ -n "${VERSION_DEMANDEE}" ]; then v="${VERSION_DEMANDEE#v}"; publier=1
          else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; publier=0; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "publier=$publier" >> "$GITHUB_OUTPUT"
          xcrun swiftc --version

      # Signature stable : si le dépôt a le certificat « Home Dev » dans ses secrets (HOME_DEV_P12 = le fichier .p12 en base64,
      # HOME_DEV_MDP = son mot de passe), il est posé dans un trousseau jetable et salon-construire.command signe avec. Toutes les versions
      # ont alors la même identité : macOS ne redemande pas les autorisations de Home à chaque mise à jour. Sans ces secrets (ou dans une
      # contribution venue d'ailleurs, qui ne les reçoit pas), la signature reste ad hoc.
      - name: Certificat « Home Dev »
        env:
          P12: ${{ secrets.HOME_DEV_P12 }}
          MDP: ${{ secrets.HOME_DEV_MDP }}
        run: |
          if [ -z "$P12" ]; then echo "pas de certificat dans les secrets : signature ad hoc"; exit 0; fi
          T="$RUNNER_TEMP/home-dev.keychain-db"; C="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/home-dev.p12"
          security create-keychain -p "$C" "$T" && security set-keychain-settings -lut 3600 "$T" && security unlock-keychain -p "$C" "$T"
          security import "$RUNNER_TEMP/home-dev.p12" -k "$T" -P "$MDP" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$C" "$T" >/dev/null
          security list-keychains -d user -s "$T" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/home-dev.p12"
          security find-identity -p codesigning "$T" | grep -c '"Home Dev"' | sed 's/^/certificats « Home Dev » trouvés : /'

      - name: Compiler Home.app
        env:
          HOME_BUILD_ONLY: ${{ github.workspace }}/dist
          HOME_VERSION: ${{ steps.version.outputs.version }}
        run: bash app/salon-construire.command < /dev/null

      - name: Signature de l'app
        run: codesign -dv dist/Home.app 2>&1 | grep -E "Authority|Signature|Identifier" || true

      - name: Journal de compilation
        if: always()
        run: '[ -f app/compilation.log ] && grep -E "error:|warning: unre" app/compilation.log | head -100 || true'

      - name: Image disque (.dmg)
        run: |
          # Home.app et un raccourci vers Applications : on ouvre le .dmg et on glisse l'app dedans
          mkdir -p dist/dmg && cp -R dist/Home.app dist/dmg/Home.app && ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Home" -srcfolder dist/dmg -fs HFS+ -format UDZO -ov dist/Home-macSilicon.dmg
          cd dist && shasum -a 256 Home-macSilicon.dmg | tee Home-macSilicon.dmg.sha256

      - name: Garder l'app (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Home-${{ steps.version.outputs.version }}
          path: |
            dist/Home-macSilicon.dmg
            dist/Home-macSilicon.dmg.sha256
          retention-days: 7

  # Home pour Windows (dossier windows/, C# / Avalonia) : même numéro de version que l'app Mac. Autonome : .NET est dans le zip.
  windows:
    needs: construire
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compiler Home pour Windows
        shell: bash
        env:
          VERSION: ${{ needs.construire.outputs.version }}
        run: dotnet publish windows/Home.csproj -c Release -r win-x64 --self-contained true -p:Version="${VERSION}" -p:DebugType=none -o dist/Home

      # Le setup (windows/installeur.iss) : installe pour l'utilisateur seul, et sert aussi aux mises à jour que Home lance lui-même
      - name: Setup
        shell: pwsh
        env:
          HOME_VERSION: ${{ needs.construire.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc windows\installeur.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # le nom publié : Home-win64-setup.exe (windows/installeur.iss écrit Home-Setup.exe ; on le renomme ici, sans toucher à windows/)
          Move-Item -Force dist/Home-Setup.exe dist/Home-win64-setup.exe
          (Get-FileHash dist/Home-win64-setup.exe -Algorithm SHA256).Hash.ToLower() + "  Home-win64-setup.exe" | Out-File -Encoding ascii dist/Home-win64-setup.exe.sha256

      - name: Garder l'app (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Home-Windows-${{ needs.construire.outputs.version }}
          path: |
            dist/Home-win64-setup.exe
            dist/Home-win64-setup.exe.sha256
          retention-days: 7

  # La release ne sort que si les deux apps ont compilé : jamais une version Mac sans sa version Windows
  publier:
    needs: [construire, windows]
    if: needs.construire.outputs.publier == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.construire.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/Home-macSilicon.dmg dist/Home-macSilicon.dmg.sha256 dist/Home-win64-setup.exe dist/Home-win64-setup.exe.sha256 \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Home ${VERSION}" --generate-notes
